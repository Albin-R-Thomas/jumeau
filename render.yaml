# One paid container plus one persistent disk. Review cost before creation.
services:
  - type: web
    name: cityweather
    runtime: docker
    region: singapore
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: cityweather-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: API_KEY
        generateValue: true
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "900"
      - key: BULK_WORKER_CONCURRENCY
        value: "1"
      - key: BULK_DB_BATCH_SIZE
        value: "100"
      - key: BULK_DISPATCH_BATCH_SIZE
        value: "100"
      - key: BULK_UPLOAD_MAX_BYTES
        value: "10485760"
      - key: BULK_UPLOAD_MAX_ROWS
        value: "100000"
      - key: PROVIDER_CONFIG_REVISION
        value: initial
