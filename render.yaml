# Paid deployment. Review Render's cost summary before creating resources.
services:
  - type: web
    name: cityweather-api
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run generate && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: API_KEY
        generateValue: true
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cityweather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cityweather-redis
          property: connectionString
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "900"
      - key: BULK_STAGING_DIR
        value: /tmp/cityweather-uploads
      - key: PROVIDER_CONFIG_REVISION
        value: initial

  - type: worker
    name: cityweather-worker
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run generate && npm run build
    # Each service migrates before starting, including on the first deployment.
    # Prisma uses PostgreSQL advisory locking to serialize concurrent deploys.
    preDeployCommand: npm run migrate
    startCommand: npm run start:worker
    envVars:
      - key: NODE_VERSION
        value: 24.16.0
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: API_KEY
        fromService:
          type: web
          name: cityweather-api
          envVarKey: API_KEY
      - key: OPENWEATHER_API_KEY
        fromService:
          type: web
          name: cityweather-api
          envVarKey: OPENWEATHER_API_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: cityweather-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cityweather-redis
          property: connectionString
      - key: WEATHER_CACHE_TTL_SECONDS
        value: "900"
      - key: PROVIDER_CONFIG_REVISION
        value: initial

  - type: keyvalue
    name: cityweather-redis
    region: singapore
    plan: 256mb
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

databases:
  - name: cityweather-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: cityweather
    user: cityweather
    diskSizeGB: 5
    ipAllowList: []
